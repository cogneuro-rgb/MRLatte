# MRLatte production stack: the app (FastAPI serving the React build and /api)
# + Caddy for TLS and reverse proxy. Configure via a repo-root .env
# (see .env.example): at minimum set DOMAIN.
#
# Run from the repo root (--project-directory keeps .env resolution at repo
# root even though this compose file lives under deploy/):
#   docker compose -f deploy/docker-compose.yml --project-directory . up -d --build
#
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      STATIC_DIR: /app/frontend/build
      ATLAS_DIR: /app/frontend/build/atlases
    expose:
      - "8001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
