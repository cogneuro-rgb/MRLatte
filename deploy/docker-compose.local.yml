# Local-only stack — no Caddy, no domain, no TLS.
# Access the app at http://localhost:8001 after starting.
#
# Run from the repo root (--project-directory keeps relative paths/.env
# resolution at repo root even though this compose file lives under deploy/):
#   docker compose -f deploy/docker-compose.local.yml --project-directory . up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      STATIC_DIR: /app/frontend/build
      ATLAS_DIR: /app/frontend/build/atlases
    ports:
      - "8001:8001"
