# NeuroVue production stack: MongoDB + the app (FastAPI serving the React build
# and /api) + Caddy for TLS and reverse proxy. Configure via a repo-root .env
# (see .env.example): at minimum set DOMAIN.
#
#   docker compose up -d --build
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-neurovue}
      CORS_ORIGINS: https://${DOMAIN}
      STATIC_DIR: /app/frontend/build
      LESION_DIR: /data/lesions
      ATLAS_DIR: /app/frontend/build/atlases
    volumes:
      - lesions_data:/data/lesions
    expose:
      - "8001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  lesions_data:
  caddy_data:
  caddy_config:
